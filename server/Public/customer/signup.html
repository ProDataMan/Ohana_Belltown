<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an Account | Ohana Belltown</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/" class="brand">
          <img src="/images/logo.png" alt="Ohana Belltown logo" class="brand-logo" />
          <span class="brand-name">Ohana Belltown</span>
        </a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="site-nav">
          <a href="/">Home</a>
          <div class="nav-dropdown">
            <button class="nav-dropdown-toggle" type="button">Menu &#9662;</button>
            <div class="nav-dropdown-menu">
              <a href="/menu">Food Menu</a>
              <a href="/sushi">Sushi</a>
              <a href="/drinks">Drinks</a>
              <a href="/specials">Specials</a>
              <a href="/happy-hour">Happy Hour</a>
            </div>
          </div>
          <a href="/local">Local</a>
          <a href="/about">About</a>
          <a href="/gallery">Gallery</a>
          <a href="/contact">Contact</a>
          <a href="/rewards">Rewards</a>
          <a href="/account-login">Log In</a>
          <a class="nav-order-btn" href="https://ordering.chownow.com/order/24080/locations?add_cn_ordering_class=true" target="_blank" rel="noopener">Order Online</a>
        </nav>
      </div>
    </header>

    <main class="page" style="max-width: 420px;">
      <header class="hero">
        <p class="eyebrow">Ohana Belltown</p>
        <h1>Create an Account</h1>
      </header>

      <section class="panel">
        <div class="oauth-buttons">
          <a class="oauth-btn oauth-btn-google" href="/auth/google/customer">Continue with Google</a>
          <a class="oauth-btn oauth-btn-apple" href="/auth/apple/customer">Continue with Apple</a>
        </div>
        <div class="oauth-divider"><span>or</span></div>
        <form id="signup-form">
          <label>Name
            <input type="text" id="name-input" required />
          </label>
          <label>Email
            <input type="email" id="email-input" autocomplete="email" required />
          </label>
          <label>Password
            <input type="password" id="password-input" autocomplete="new-password" required minlength="5" />
          </label>
          <button type="submit">Create Account</button>
          <p id="signup-status" class="status"></p>
        </form>
        <p class="hint" style="margin-top: 1rem;">Already have an account? <a href="/account-login">Log in</a></p>
      </section>
    </main>

    <script src="/nav.js"></script>
    <script src="/signup.js"></script>
  </body>
</html>
