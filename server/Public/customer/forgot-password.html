<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Ohana Belltown</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/" class="brand">
          <img src="/images/logo.png" alt="Ohana Belltown logo" class="brand-logo" />
          <span class="brand-name">Ohana Belltown</span>
        </a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="site-nav">
          <a href="/">Home</a>
          <a href="/account-login" id="nav-login-link">Log In</a>
        </nav>
      </div>
    </header>

    <main class="page" style="max-width: 420px;">
      <header class="hero">
        <p class="eyebrow">Ohana Belltown</p>
        <h1>Forgot Password</h1>
      </header>

      <section class="panel">
        <form id="forgot-password-form">
          <label>Email
            <input type="email" id="email-input" autocomplete="email" required />
          </label>
          <button type="submit">Send Reset Link</button>
          <p id="forgot-password-status" class="status"></p>
        </form>
      </section>
    </main>

    <script src="/nav.js"></script>
    <script src="/forgot-password.js"></script>
  </body>
</html>
