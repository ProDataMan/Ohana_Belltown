<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account — Ohana Belltown</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="./style.css" />

  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Ohana Belltown — Staff</p>
        <h1>My Account</h1>
        <p class="admin-link"><a href="/menu">&larr; Back to menu</a></p>
        <div class="staff-tools-nav">

      </header>

      <section class="panel">
        <h2>Profile</h2>
        <div id="profile-info" class="hint">Loading...</div>

          <a class="cta-button secondary" href="/change-password.html">Change Password</a>
          <button id="logout-btn" type="button" class="secondary">Log Out</button>
        </div>

      <section class="panel">
        <h2>Linked Sign-In</h2>
        <p class="hint">Link a Google or Apple account to sign in without your password.</p>
        <div id="oauth-links" class="oauth-buttons"></div>

    <script src="./staff-auth.js"></script>
    <script src="./account.js"></script>
