<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics — Ohana Belltown</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Ohana Belltown — Staff</p>
        <h1>Analytics</h1>
        <p>Self-hosted, privacy-friendly pageview counts. No cookies, no third-party tracking — just which pages get visited.</p>
        <p class="admin-link"><a href="/menu">&larr; Back to menu</a></p>
        <div class="staff-tools-nav">
          <a href="/edit.html">Menu Editor</a>
          <a href="/loyalty-admin.html">Loyalty</a>
          <a href="/events-admin.html">Events</a>
          <a href="/table-card.html">Table Cards</a>
          <a href="/account.html">My Account</a>
          <a href="/manage-users.html">Manage Users</a>
          <a href="/analytics.html" class="active">Analytics</a>
        </div>
      </header>

      <section class="panel">
        <div class="editor-toolbar">
          <h2>Overview</h2>
          <div class="toolbar-actions">
            <select id="range-select">
              <option value="7">Last 7 days</option>
              <option value="30" selected>Last 30 days</option>
              <option value="90">Last 90 days</option>
            </select>
          </div>
        </div>
        <div id="overview" class="hint">Loading...</div>
      </section>

      <section class="panel">
        <h2>Views by Day</h2>
        <div id="daily-chart"></div>
      </section>

      <section class="panel">
        <h2>Top Pages</h2>
        <div id="top-pages"></div>
      </section>
    </main>

    <script src="./staff-auth.js"></script>
    <script src="./analytics.js"></script>
  </body>
</html>
