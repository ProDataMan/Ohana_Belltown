<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password — Ohana Belltown</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="page" style="max-width: 420px;">
      <header class="hero">
        <p class="eyebrow">Ohana Belltown — Staff</p>
        <h1>Change Password</h1>
        <p class="admin-link"><a href="/account.html">&larr; Back to my account</a></p>
      </header>

      <section class="panel">
        <form id="change-password-form">
          <label>Current password
            <input type="password" id="current-password-input" autocomplete="current-password" required />
          </label>
          <label>New password
            <input type="password" id="new-password-input" autocomplete="new-password" required minlength="5" />
          </label>
          <label>Confirm new password
            <input type="password" id="confirm-password-input" autocomplete="new-password" required minlength="5" />
          </label>
          <button type="submit">Change Password</button>
          <p id="change-password-status" class="status"></p>
        </form>
      </section>
    </main>

    <script src="../staff-auth.js"></script>
    <script src="../change-password.js"></script>
  </body>
</html>
