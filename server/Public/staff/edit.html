<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Menu — Ohana Belltown</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Ohana Belltown — Staff</p>
        <h1>Edit Menu</h1>
        <p>
          Changes made here are saved directly to the live website. Make your edits,
          then click Save.
        </p>
        <p class="admin-link"><a href="/menu">&larr; Back to menu</a></p>
        <div class="staff-tools-nav">
          <a href="/edit.html" class="active">Menu Editor</a>
          <a href="/loyalty-admin.html">Loyalty</a>
          <a href="/events-admin.html">Events</a>
          <a href="/table-card.html">Table Cards</a>
          <a href="/account.html">My Account</a>
          <a href="/manage-users.html">Manage Users</a>
          <a href="/analytics.html">Analytics</a>
        </div>
      </header>

      <p id="status" class="status"></p>

      <section id="editor-panel" class="panel">
        <div class="editor-toolbar">
          <h2>Menu Items</h2>
          <div class="toolbar-actions">
            <button id="reload-btn" type="button" class="secondary">Reload latest</button>
          </div>
        </div>
        <div id="section-jump" class="section-tabs"></div>
        <div id="featured-summary"></div>
        <div id="categories"></div>
        <div class="cta-row">
          <select id="add-category-section">
            <option value="menu">Food Menu</option>
            <option value="sushi">Sushi</option>
            <option value="drinks">Drinks</option>
            <option value="happy_hour">Happy Hour</option>
          </select>
          <button id="add-category-btn" type="button" class="secondary">+ Add category</button>
        </div>

        <div class="save-row">
          <button id="save-btn" type="button">Save changes</button>
          <p id="save-status" class="status"></p>
        </div>
      </section>
    </main>

    <script src="./staff-auth.js"></script>
    <script src="./edit.js"></script>
  </body>
</html>
